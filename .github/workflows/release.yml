name: Release

# A version tag (v1.2.3) publishes the images to GHCR, tagged with the version and the commit
# SHA, with an SBOM and provenance attestation, and creates a GitHub release carrying the SBOMs
# and the latest evaluation report. The deploy job runs only when a server is configured:
#   repository variable DEPLOY_ENABLED=true, environment "production" with secrets
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (and optional DEPLOY_PATH).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the v), e.g. 0.6.0"
        required: true

permissions:
  contents: read

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GitHub release
      packages: write        # GHCR
      id-token: write        # provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          pyv=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
          if [ "$v" != "$pyv" ]; then echo "::error::tag $v does not match backend/pyproject.toml $pyv"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.v.outputs.registry }}/lexai-backend:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.registry }}/lexai-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
      - name: Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.v.outputs.registry }}/lexai-web:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.registry }}/lexai-web:${{ github.sha }}
          cache-from: type=gha,scope=web
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.v.outputs.registry }}/lexai-backend
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: SBOM files (SPDX) for the release page
        run: |
          for img in lexai-backend lexai-web; do
            docker buildx imagetools inspect "${{ steps.v.outputs.registry }}/$img:${{ steps.v.outputs.version }}" \
              --format '{{ json .SBOM }}' > "$img.sbom.spdx.json"
          done
          ls -la ./*.sbom.spdx.json
      - name: Latest evaluation report
        run: |
          report=$(ls -t eval/reports/*/report.md | head -1)
          cp "$report" evaluation-report.md
          echo "attached $report"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          notes="Images: \`${{ steps.v.outputs.registry }}/lexai-backend:${{ steps.v.outputs.version }}\`, \`${{ steps.v.outputs.registry }}/lexai-web:${{ steps.v.outputs.version }}\` (also tagged \`${{ github.sha }}\`). Deploy: \`python3 deploy/deploy.py --tag ${{ steps.v.outputs.version }}\` (docs/runbook.md)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.sbom.spdx.json evaluation-report.md --clobber
          else
            gh release create "$tag" ./*.sbom.spdx.json evaluation-report.md --title "LexAI $tag" \
              --notes "$notes" --target "${{ github.sha }}"
          fi

  deploy:
    name: Deploy to the server
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # protection rules (approvals) apply here
    concurrency: production
    steps:
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy with automatic rollback (deploy/deploy.py on the server)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ secrets.DEPLOY_PATH || '/opt/lexai' }}
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "set -e; cd '$DIR' && git fetch --tags --quiet && git checkout --quiet 'v$VERSION' && \
             python3 deploy/deploy.py --tag '$VERSION' --min-cited 4"
