# LexAI corpus manifest — the single source of truth for what gets indexed.
#
# Each document is either downloaded (`urls`, tried in order; the first verified
# download is pinned in data/manifest.lock.json) or bundled in data/bundled/
# (`file`, checked against data/bundled/SHA256SUMS).
#
# `expect` lists phrases the parsed text MUST contain (matched case- and
# space-insensitively). `min_units` is the fewest sections/articles the parser
# must find. Either check failing stops ingestion: a truncated source (like the
# 58-page IPC in v0.1) can never be indexed silently.
#
# Sources: India Code (consolidated, with an arrangement of sections) first; the
# Gazette of India print of the Act as enacted (PRS Legislative Research, Ministry
# of Home Affairs) as fallbacks. The parser reads both layouts; `expect` phrases
# are taken from section bodies, not titles, so they hold in either.
#
# Dates are ISO (YYYY-MM-DD). `repealed_on` + `replaced_by` let answers say which
# code applies: the old codes still govern offences committed before 1 July 2024.

version: 1

documents:
  # ---------------------------------------------------------------- new codes
  - id: bns-2023
    title: The Bharatiya Nyaya Sanhita, 2023
    short_name: BNS
