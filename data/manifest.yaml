# Supreme Court judgments from JUDIS. One document per file; the case name,
# date, bench and citation are read from each judgment's header.
collections:
  - id_prefix: sc
    doc_type: judgment
    glob: judgments/*.pdf
    title_prefix: Supreme Court of India
